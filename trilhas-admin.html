<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Trilhas de Treinamento</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap');

  :root{
    --azul:#3A86FF; --profundo:#0A41B4;
    --quasebranco:#F0F4FF;
    --bg:#F7F8FC; --surface:#FFFFFF; --surface-2:#EEF2FC;
    --border:#E2E7F5; --border-strong:#C9D3EC;
    --ink:#101033; --ink-2:#3A3F5C; --muted:#5C6180; --muted-2:#8A8FB0;
    --success:#16A34A; --success-bg:#ECFDF5;
    --warning:#B45309; --warning-bg:#FFFBEB;
    --danger:#B91C1C; --danger-bg:#FEF2F2;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1024; --surface:#171933; --surface-2:#1F2242;
      --border:#2B2E56; --border-strong:#3A3D6B;
      --ink:#EDEEFA; --ink-2:#C7C9E8; --muted:#9498C2; --muted-2:#6A6E9C;
      --success:#4ADE80; --success-bg:#0F2A1B;
      --warning:#FBBF24; --warning-bg:#2A2112;
      --danger:#F87171; --danger-bg:#2A1515;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1024; --surface:#171933; --surface-2:#1F2242;
    --border:#2B2E56; --border-strong:#3A3D6B;
    --ink:#EDEEFA; --ink-2:#C7C9E8; --muted:#9498C2; --muted-2:#6A6E9C;
    --success:#4ADE80; --success-bg:#0F2A1B;
    --warning:#FBBF24; --warning-bg:#2A2112;
    --danger:#F87171; --danger-bg:#2A1515;
  }

  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; line-height:1.55;}
  h1,h2,h3{font-family:Poppins,Inter,sans-serif; margin:0; color:var(--ink);}
  .page{max-width:960px; margin:0 auto; padding:28px 20px 90px;}
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:16px; padding-bottom:18px; margin-bottom:22px; border-bottom:1px solid var(--border);}
  .topbar h1{font-size:19px; font-weight:800;}
  .topbar p{margin:2px 0 0; font-size:12.5px; color:var(--muted);}

  .tabs{display:flex; gap:4px; background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:4px; margin-bottom:22px; width:fit-content;}
  .tab-btn{appearance:none; border:none; background:transparent; cursor:pointer; font-family:inherit; font-size:13px; font-weight:600; color:var(--muted); padding:9px 15px; border-radius:9px;}
  .tab-btn.active{background:var(--surface); color:var(--profundo);}
  .panel{display:none;}
  .panel.active{display:block;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px; margin-bottom:16px;}
  .card h2{font-size:15px; font-weight:700; margin-bottom:10px;}
  .form-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
  .form-input, select.form-input, textarea.form-input{padding:9px 11px; border-radius:9px; border:1px solid var(--border-strong); background:var(--surface); color:var(--ink); font-family:inherit; font-size:13px; flex:1; min-width:160px;}
  textarea.form-input{resize:vertical;}
  .btn{background:var(--azul); color:#fff; border:none; font-family:inherit; font-size:13px; font-weight:700; padding:9px 16px; border-radius:9px; cursor:pointer; white-space:nowrap;}
  .btn:hover{background:var(--profundo);}
  .btn:disabled{background:var(--border-strong); color:var(--muted-2); cursor:not-allowed;}
  .btn-danger{background:transparent; color:var(--danger); border:1px solid var(--danger); font-family:inherit; font-size:12px; font-weight:600; padding:5px 10px; border-radius:7px; cursor:pointer;}
  .btn-ghost{background:transparent; color:var(--muted); border:1px solid var(--border-strong); font-family:inherit; font-size:12px; font-weight:600; padding:5px 10px; border-radius:7px; cursor:pointer;}

  .trilha-bloco{border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:10px;}
  .trilha-bloco.arquivada{opacity:.55;}
  .trilha-bloco-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px;}
  .produto-tag{display:inline-block; font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:20px; background:var(--surface-2); color:var(--profundo); margin-bottom:4px;}
  .produto-tag.geral{background:var(--success-bg); color:var(--success);}
  .produtos-checklist{display:flex; flex-wrap:wrap; gap:6px 10px; margin-bottom:8px;}
  .produtos-checklist label{display:flex; align-items:center; gap:5px; font-size:12.5px; color:var(--ink-2);}
  .produtos-checklist.disabled{opacity:.45; pointer-events:none;}
  .campos-formulario-lista{display:flex; flex-wrap:wrap; gap:6px 16px; margin-bottom:10px;}
  .campo-formulario-item{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; color:var(--ink-2); margin-right:4px;}
  .campo-formulario-obrigatorio{display:inline-flex; align-items:center; gap:4px; font-size:11px; color:var(--muted); margin-right:14px;}
  .geral-toggle{display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; margin-bottom:10px;}
  .video-row{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:7px 0; border-top:1px solid var(--border); font-size:13px;}
  .video-row:first-child{border-top:none;}
  .video-row-info{display:flex; align-items:center; gap:8px; min-width:0;}
  .video-row-titulo{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .video-row-acoes{display:flex; gap:4px; flex-shrink:0;}
  .btn-ordem{background:transparent; border:1px solid var(--border-strong); color:var(--muted); font-size:11px; line-height:1; padding:4px 7px; border-radius:6px; cursor:pointer;}
  .btn-ordem:hover{color:var(--ink); border-color:var(--ink-2);}
  .btn-ordem:disabled{opacity:.3; cursor:not-allowed;}
  .video-subtitulo{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding-top:10px; margin-top:6px; border-top:1px solid var(--border);}
  .video-subtitulo:first-child{border-top:none; padding-top:0; margin-top:0;}
  .edit-video-form{border-top:1px solid var(--border); padding-top:8px; margin-top:6px;}
  .busca-input{margin-bottom:14px;}
  .msg{font-size:12.5px; margin-top:8px; min-height:16px;}
  .msg.erro{color:var(--danger);}
  .msg.ok{color:var(--success);}
  table.simples{width:100%; font-size:13px; border-collapse:collapse;}
  table.simples th, table.simples td{text-align:left; padding:8px 6px; border-bottom:1px solid var(--border);}
  table.simples th{font-size:11px; text-transform:uppercase; color:var(--muted); letter-spacing:.04em;}
  .vazio{font-size:13px; color:var(--muted); padding:6px 0;}
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <div>
      <h1>Admin — Trilhas de Treinamento</h1>
      <p>Uso interno · gestão/CSM/ISM</p>
    </div>
  </header>
  <div id="raiz"></div>
</div>

<script>
(function(){
  "use strict";
  var raiz = document.getElementById("raiz");

  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;", "'":"&#39;" }[c];
    });
  }
  function tratarResposta(r){
    return r.json().then(function(j){ if (!r.ok) throw j; return j; });
  }
  function apiGet(path){ return fetch(path, { credentials: "same-origin" }).then(tratarResposta); }
  function apiPost(path, body){
    return fetch(path, {
      method: "POST", credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {})
    }).then(tratarResposta);
  }

  // ---------- Login (mesma sessão interna de implantacao-waipe.html / dashboard_carteiras.html) ----------
  function renderLogin(){
    raiz.innerHTML =
      '<div class="card" style="max-width:380px;margin:60px auto;">' +
        '<h2 style="margin-bottom:6px;">Entrar</h2>' +
        '<p style="font-size:12.5px;color:var(--muted);margin:0 0 14px;">Sessão interna — mesma senha do painel de implantação.</p>' +
        '<input type="password" id="loginSenha" class="form-input" style="width:100%;margin-bottom:10px;" placeholder="Senha de acesso">' +
        '<button type="button" class="btn" style="width:100%;" id="btnEntrar">Entrar</button>' +
        '<div class="msg erro" id="loginErro"></div>' +
      '</div>';
    var senha = document.getElementById("loginSenha");
    var btn = document.getElementById("btnEntrar");
    var erroEl = document.getElementById("loginErro");
    function tentar(){
      if (!senha.value){ erroEl.textContent = "Digite a senha."; return; }
      btn.disabled = true; btn.textContent = "Entrando...";
      apiPost("/api/login", { senha: senha.value })
        .then(function(){ iniciar(); })
        .catch(function(e){
          erroEl.textContent = (e && e.error) || "Senha incorreta.";
          btn.disabled = false; btn.textContent = "Entrar";
        });
    }
    btn.addEventListener("click", tentar);
    senha.addEventListener("keydown", function(e){ if (e.key === "Enter") tentar(); });
    senha.focus();
  }

  function tratar401(e){
    if (e && e.code === "sessao_invalida"){ renderLogin(); return true; }
    return false;
  }

  // ---------- Layout principal ----------
  // Lista de produtos sugerida nos checkboxes de trilha. Começa com um
  // fallback pequeno (produtos que não vêm de um plano com "camadas", tipo
  // Waipe) e, assim que os clientes forem carregados, passa a refletir os
  // valores REAIS vindos do ClickUp — Unique e Gestor não existem como valor
  // isolado lá, o que existe é "Unique Light/Plus/Premium" etc. Usar uma lista
  // fixa e chutada foi o que causou trilha marcada "Unique" não aparecer pra
  // quem tinha "Unique Light".
  var produtosConhecidos = ["Waipe", "Analytics Pro", "IA Bime", "Datalab"];
  var clientesCache = []; // preenchido por carregarClientes() — reaproveitado pra busca de elegíveis de prêmio
  function atualizarProdutosConhecidos(clientes){
    var vistos = {};
    clientes.forEach(function(c){ (c.produtos_ativos || []).forEach(function(p){ vistos[p] = true; }); });
    var lista = Object.keys(vistos);
    if (lista.length) produtosConhecidos = lista.sort(function(a, b){ return a.localeCompare(b, "pt-BR"); });
  }

  function iniciar(){
    raiz.innerHTML =
      '<div class="tabs">' +
        '<button class="tab-btn active" data-tab="trilhas">Trilhas</button>' +
        '<button class="tab-btn" data-tab="clientes">Clientes &amp; E-mails</button>' +
        '<button class="tab-btn" data-tab="indicadores">Indicadores</button>' +
        '<button class="tab-btn" data-tab="gamificacao">Gamificação</button>' +
      '</div>' +
      '<section class="panel active" id="panel-trilhas"></section>' +
      '<section class="panel" id="panel-clientes"></section>' +
      '<section class="panel" id="panel-indicadores"></section>' +
      '<section class="panel" id="panel-gamificacao"></section>';

    var panels = {
      trilhas: document.getElementById("panel-trilhas"),
      clientes: document.getElementById("panel-clientes"),
      indicadores: document.getElementById("panel-indicadores"),
      gamificacao: document.getElementById("panel-gamificacao")
    };
    var indicadoresCarregados = false;
    var gamificacaoCarregada = false;
    raiz.querySelectorAll(".tab-btn").forEach(function(btn){
      btn.addEventListener("click", function(){
        raiz.querySelectorAll(".tab-btn").forEach(function(b){ b.classList.remove("active"); });
        btn.classList.add("active");
        Object.keys(panels).forEach(function(k){ panels[k].classList.remove("active"); });
        var tab = btn.getAttribute("data-tab");
        panels[tab].classList.add("active");
        if (tab === "indicadores" && !indicadoresCarregados){ indicadoresCarregados = true; carregarIndicadoresAdmin(); }
        if (tab === "gamificacao" && !gamificacaoCarregada){ gamificacaoCarregada = true; carregarGamificacao(); }
      });
    });

    // Clientes primeiro: além de preencher a própria aba, alimenta
    // produtosConhecidos, usado pelos checkboxes de produto da aba Trilhas
    // (e das regras automáticas de pontos, na aba Gamificação).
    carregarClientes().then(function(){ carregarTrilhas(); });
  }

  // ---------- Aba Trilhas ----------
  function carregarTrilhas(){
    var root = document.getElementById("panel-trilhas");
    root.innerHTML = '<div class="vazio">Carregando...</div>';
    apiGet("/api/trilhas-admin").then(function(j){ renderTrilhas(root, j.trilhas || []); })
      .catch(function(e){ if (!tratar401(e)) root.innerHTML = '<div class="msg erro">' + escapeHtml((e && e.error) || "Erro ao carregar.") + '</div>'; });
  }

  /** Checkboxes de produto — reaproveitado no form de criar e no de editar.
   * `checados` inclui qualquer produto customizado que a trilha já tenha (não
   * só os sugeridos), pra editar não "esquecer" um produto avulso cadastrado antes. */
  function produtosChecklistHtml(classe, checados){
    var opcoes = produtosConhecidos.slice();
    (checados || []).forEach(function(p){ if (opcoes.indexOf(p) === -1) opcoes.push(p); });
    return opcoes.map(function(p){
      var marcado = checados && checados.indexOf(p) !== -1;
      return '<label><input type="checkbox" class="' + classe + '" value="' + escapeHtml(p) + '"' + (marcado ? ' checked' : '') + '> ' + escapeHtml(p) + '</label>';
    }).join("");
  }

  /** Uma linha de vídeo + o form de edição escondido embaixo dela. */
  function videoRowHtml(t, v, i, total){
    return (
      '<div class="video-row' + (v.ativo === false ? ' arquivada' : '') + '" data-video-row="' + v.id + '">' +
        '<div class="video-row-info">' +
          '<div class="video-row-acoes">' +
            '<button type="button" class="btn-ordem" data-mover-video="' + v.id + '" data-trilha="' + t.id + '" data-direcao="up"' + (i === 0 ? ' disabled' : '') + '>▲</button>' +
            '<button type="button" class="btn-ordem" data-mover-video="' + v.id + '" data-trilha="' + t.id + '" data-direcao="down"' + (i === total - 1 ? ' disabled' : '') + '>▼</button>' +
          '</div>' +
          '<span class="video-row-titulo">' + escapeHtml(v.titulo) + ' <span style="color:var(--muted-2);">(' + escapeHtml(v.youtube_id) + ')</span></span>' +
          (v.atividade_titulo ? ' <span class="produto-tag geral">🏆 ' + escapeHtml(v.atividade_titulo) + '</span>' : '') +
        '</div>' +
        '<div style="display:flex;gap:4px;flex-shrink:0;">' +
          '<button type="button" class="btn-ghost" data-editar-video="' + v.id + '">Editar</button>' +
          '<button type="button" class="btn-ghost" data-arquivar-video="' + v.id + '" data-ativo="' + (v.ativo === false) + '">' + (v.ativo === false ? 'Reativar' : 'Arquivar') + '</button>' +
          '<button type="button" class="btn-danger" data-excluir-video="' + v.id + '">Excluir</button>' +
        '</div>' +
      '</div>' +
      '<div class="edit-video-form" data-edit-video-form="' + v.id + '" style="display:none;">' +
        '<div class="form-row">' +
          '<input type="text" class="form-input" data-edit-video-subtitulo="' + v.id + '" value="' + escapeHtml(v.subtitulo || "") + '" placeholder="Subtítulo da seção (opcional) — ex: Folha de pagamento">' +
        '</div>' +
        '<div class="form-row">' +
          '<input type="text" class="form-input" data-edit-video-titulo="' + v.id + '" value="' + escapeHtml(v.titulo) + '" placeholder="Título">' +
          '<input type="text" class="form-input" data-edit-video-youtube="' + v.id + '" value="' + escapeHtml(v.youtube_id) + '" placeholder="Link ou ID do YouTube">' +
        '</div>' +
        '<div class="form-row">' +
          '<textarea class="form-input" data-edit-video-nota="' + v.id + '" placeholder="Nota (opcional) — ex: link pra base de conhecimento" rows="2">' + escapeHtml(v.nota || "") + '</textarea>' +
        '</div>' +
        '<div class="form-row">' +
          '<input type="text" class="form-input" data-edit-video-atividade="' + v.id + '" value="' + escapeHtml(v.atividade_titulo || "") + '" placeholder="Atividade prática (opcional)">' +
        '</div>' +
        '<div class="form-row">' +
          '<button type="button" class="btn" data-salvar-video="' + v.id + '">Salvar</button>' +
          '<button type="button" class="btn-ghost" data-cancelar-video="' + v.id + '">Cancelar</button>' +
        '</div>' +
        '<div class="msg" data-msg-edit-video="' + v.id + '"></div>' +
      '</div>'
    );
  }

  /** Vídeos, na ordem, com um cabeçalho antes de cada trecho contíguo que muda de subtítulo. */
  function videoListaAgrupadaHtml(t, videos){
    var html = "";
    var ultimoSubtitulo;
    videos.forEach(function(v, i){
      var sub = v.subtitulo || null;
      if (sub !== ultimoSubtitulo){
        if (sub) html += '<div class="video-subtitulo">' + escapeHtml(sub) + '</div>';
        ultimoSubtitulo = sub;
      }
      html += videoRowHtml(t, v, i, videos.length);
    });
    return html;
  }

  function renderTrilhas(root, trilhas){
    var lista = trilhas.slice().sort(function(a, b){ return a.titulo.localeCompare(b.titulo, "pt-BR"); });

    var html =
      '<div class="card">' +
        '<h2>Nova trilha</h2>' +
        '<div class="form-row">' +
          '<input type="text" id="novaTitulo" class="form-input" placeholder="Título da trilha">' +
        '</div>' +
        '<label class="geral-toggle"><input type="checkbox" id="novoGeral"> Trilha geral — aparece pra todo cliente, de qualquer produto</label>' +
        '<div class="produtos-checklist" id="novoProdutosBox">' +
          produtosChecklistHtml("novo-produto-check", []) +
        '</div>' +
        '<div class="form-row">' +
          '<input type="text" id="novoProdutoExtra" class="form-input" placeholder="Outro produto (opcional, separado por vírgula)">' +
          '<button type="button" class="btn" id="btnCriarTrilha">Criar</button>' +
        '</div>' +
        '<div class="msg" id="msgNovaTrilha"></div>' +
      '</div>' +
      '<input type="text" id="buscaTrilhas" class="form-input busca-input" placeholder="Buscar trilha ou vídeo pelo título...">';

    lista.forEach(function(t){
        var videos = (t.trilha_videos || []).slice().sort(function(a,b){ return a.ordem - b.ordem; });
        var produtosAtuais = t.produtos || [];
        var chips = produtosAtuais.length
          ? produtosAtuais.map(function(p){ return '<span class="produto-tag" title="[' + escapeHtml(p) + ']">' + escapeHtml(p) + '</span>'; }).join(" ")
          : '<span class="produto-tag geral">Geral</span>';
        var textoBusca = (t.titulo + " " + videos.map(function(v){ return v.titulo; }).join(" ")).toLowerCase();
        html +=
          '<div class="trilha-bloco' + (t.ativa ? '' : ' arquivada') + '" data-trilha-id="' + t.id + '" data-busca="' + escapeHtml(textoBusca) + '">' +
            '<div class="trilha-bloco-head">' +
              '<div class="trilha-visao" data-trilha-visao="' + t.id + '">' +
                '<b>' + escapeHtml(t.titulo) + '</b>' + (t.ativa ? '' : ' <span class="produto-tag">arquivada</span>') +
                '<div style="margin-top:5px;">' + chips + '</div>' +
              '</div>' +
              '<div style="display:flex;gap:6px;flex-shrink:0;">' +
                '<button type="button" class="btn-ghost" data-editar-trilha="' + t.id + '">Editar</button>' +
                '<button type="button" class="btn-ghost" data-arquivar-trilha="' + t.id + '" data-ativa="' + (!t.ativa) + '">' + (t.ativa ? 'Arquivar' : 'Reativar') + '</button>' +
              '</div>' +
            '</div>' +
            '<div class="edit-trilha-form" data-edit-form="' + t.id + '" style="display:none;margin-bottom:10px;">' +
              '<div class="form-row">' +
                '<input type="text" class="form-input" data-edit-titulo="' + t.id + '" value="' + escapeHtml(t.titulo) + '">' +
              '</div>' +
              '<label class="geral-toggle"><input type="checkbox" data-edit-geral="' + t.id + '"' + (produtosAtuais.length ? '' : ' checked') + '> Trilha geral — aparece pra todo cliente, de qualquer produto</label>' +
              '<div class="produtos-checklist' + (produtosAtuais.length ? '' : ' disabled') + '" data-edit-produtos-box="' + t.id + '">' +
                produtosChecklistHtml("edit-produto-check-" + t.id, produtosAtuais) +
              '</div>' +
              '<div class="form-row">' +
                '<input type="text" class="form-input" placeholder="Outro produto (opcional, separado por vírgula)" data-edit-produto-extra="' + t.id + '"' + (produtosAtuais.length ? '' : ' disabled') + '>' +
              '</div>' +
              '<div class="form-row">' +
                '<button type="button" class="btn" data-salvar-trilha="' + t.id + '">Salvar</button>' +
                '<button type="button" class="btn-ghost" data-cancelar-edicao="' + t.id + '">Cancelar</button>' +
              '</div>' +
              '<div class="msg" data-msg-edit="' + t.id + '"></div>' +
            '</div>' +
            '<div class="videos-lista">' +
              (videos.length
                ? videoListaAgrupadaHtml(t, videos)
                : '<div class="vazio">Nenhum vídeo ainda.</div>') +
            '</div>' +
            '<div class="form-row" style="margin-top:10px;">' +
              '<input type="text" class="form-input" placeholder="Subtítulo da seção (opcional) — ex: Folha de pagamento" data-novo-video-subtitulo="' + t.id + '">' +
            '</div>' +
            '<div class="form-row">' +
              '<input type="text" class="form-input" placeholder="Título do vídeo" data-novo-video-titulo="' + t.id + '">' +

  function carregarClientes(){

  function renderClientes(root, clientes, emails){

        '<button type="button" class="btn" id="btnSincronizar">Sincronizar agora</button>' +
        '<div class="msg" id="msgSync"></div>' +
      '</div>' +

                  '<td>' + (c.produtos_ativos || []).map(function(p){ return '<span class="produto-tag" title="[' + escapeHtml(p) + ']">' + escapeHtml(p) + '</span>'; }).join(" ") + '</td>' +
                  '<td>' +
                    els.map(function(e){

                        ' <button type="button" class="btn-danger" data-remover-email="' + e.id + '">remover</button></div>';
                    }).join("") +
                    '<div class="form-row" style="margin-top:6px;">' +
                      '<input type="email" class="form-input" placeholder="novo e-mail" data-novo-email="' + c.id + '" style="min-width:140px;">' +
                      '<button type="button" class="btn-ghost" data-add-email="' + c.id + '">Adicionar</button>' +
                    '</div>' +
                    '<div class="msg" data-msg-cliente="' + c.id + '"></div>' +
                  '</td>' +
                '</tr>';
              }).join("") +
            '</tbody></table></div>'
          : '<div class="vazio">Nenhum cliente sincronizado ainda. Clique em "Sincronizar agora".</div>') +
      '</div>';

      var msg = document.getElementById("msgSync");

      apiPost("/api/trilhas-admin", { acao: "sincronizar" })
        .then(function(j){
          msg.className = "msg ok";
          msg.textContent = "OK — " + j.processados + " processados, " + (j.desativados || 0) + " desativados.";
          carregarClientes();
        })
        .catch(function(e){
          if (!tratar401(e)){ msg.className = "msg erro"; msg.textContent = (e && e.error) || "Erro ao sincronizar."; }

        .then(function(){ btn.disabled = false; btn.textContent = "Sincronizar agora"; });

    root.querySelectorAll("[data-remover-email]").forEach(function(btn){
      btn.addEventListener("click", function(){
        apiPost("/api/trilhas-admin", { acao: "remover_email", emailId: btn.getAttribute("data-remover-email") })

          .catch(function(e){ if (!tratar401(e)){ msg.className = "msg erro"; msg.textContent = (e && e.error) || "Erro ao adicionar e-mail."; } });

  /** Checklist de campos do formulário de declaração — reaproveitado no form de criar e no de editar regra. */
  function camposFormularioChecklistHtml(prefixo, selecionados){
    var porChave = {};
    (selecionados || []).forEach(function(c){ porChave[c.chave] = c.obrigatorio; });
    return Object.keys(CATALOGO_CAMPOS).map(function(chave){
      var marcado = porChave.hasOwnProperty(chave);
      var obrigatorio = !!porChave[chave];
      return '<label class="campo-formulario-item">' +
          '<input type="checkbox" class="' + prefixo + '-campo" value="' + chave + '"' + (marcado ? ' checked' : '') + '> ' + CATALOGO_CAMPOS[chave] +
        '</label>' +
        '<label class="campo-formulario-obrigatorio">' +
          '<input type="checkbox" class="' + prefixo + '-obrigatorio" data-chave="' + chave + '"' + (obrigatorio ? ' checked' : '') + '> obrigatório' +
        '</label>';
    }).join("");
  }

  /** Lê a checklist de volta como [{chave, obrigatorio}] — só os marcados. */
  function lerCamposFormulario(root, prefixo){
    var campos = [];
    root.querySelectorAll('.' + prefixo + '-campo:checked').forEach(function(chk){
      var chave = chk.value;
      var obrigEl = root.querySelector('.' + prefixo + '-obrigatorio[data-chave="' + chave + '"]');
      campos.push({ chave: chave, obrigatorio: obrigEl ? obrigEl.checked : false });
    });
    return campos;
  }

  function verificacaoClickupOpcoesHtml(selecionada){
    var opcoes = '<option value="">Sem verificação automática</option>';
    Object.keys(VERIFICACAO_CLICKUP_LABEL).forEach(function(chave){
      opcoes += '<option value="' + chave + '"' + (selecionada === chave ? ' selected' : '') + '>' + VERIFICACAO_CLICKUP_LABEL[chave] + '</option>';
    });
    return opcoes;
  }

      });

  function carregarEventos(status){
    var alvo = document.getElementById("listaEventos");
    if (!alvo) return;
    alvo.innerHTML = '<div class="vazio">Carregando...</div>';
    apiGet("/api/trilhas-admin?recurso=pontos-eventos&status=" + encodeURIComponent(status)).then(function(j){
      var eventos = j.eventos || [];
      if (!eventos.length){ alvo.innerHTML = '<div class="vazio">Nenhum evento ' + STATUS_EVENTO_LABEL[status].toLowerCase() + '.</div>'; return; }
      alvo.innerHTML = '<div style="overflow-x:auto;"><table class="simples"><thead><tr><th>Cliente</th><th>Regra</th><th>Respostas</th><th>Data</th>' + (status === "pendente" ? '<th>Ações</th>' : '') + '</tr></thead><tbody>' +
        eventos.map(function(e){
          var cliente = e.clientes ? e.clientes.nome : "";
          var regra = e.pontos_regras ? e.pontos_regras.titulo : "";
          var badge = "";
          if (e.clickupConfirmado === true) badge = ' <span class="produto-tag geral">✓ confirmado no ClickUp</span>';
          else if (e.clickupConfirmado === false) badge = ' <span class="produto-tag">ainda não confirmado no ClickUp</span>';
          var respostas = e.respostas || {};
          var extra = Object.keys(respostas).map(function(chave){ return (CATALOGO_CAMPOS[chave] || chave) + ": " + respostas[chave]; }).join(" — ");
          var data = e.criado_em ? new Date(e.criado_em).toLocaleDateString("pt-BR") : "";
          return '<tr>' +
            '<td>' + escapeHtml(cliente) + '</td>' +
            '<td>' + escapeHtml(regra) + badge + '</td>' +
            '<td>' + escapeHtml(extra) + '</td>' +
            '<td>' + data + '</td>' +
            (status === "pendente"
              ? '<td style="display:flex;gap:4px;"><button type="button" class="btn-ghost" data-aprovar-evento="' + e.id + '">Aprovar</button><button type="button" class="btn-danger" data-rejeitar-evento="' + e.id + '">Rejeitar</button></td>'
              : '') +
          '</tr>';
        }).join("") +
      '</tbody></table></div>';
      alvo.querySelectorAll("[data-aprovar-evento]").forEach(function(btn){
        btn.addEventListener("click", function(){
          apiPost("/api/trilhas-admin", { acao: "aprovar_evento", id: btn.getAttribute("data-aprovar-evento") })
            .then(function(){ carregarEventos(status); }).catch(function(e){ tratar401(e); });
        });
      });
      alvo.querySelectorAll("[data-rejeitar-evento]").forEach(function(btn){
        btn.addEventListener("click", function(){
          apiPost("/api/trilhas-admin", { acao: "rejeitar_evento", id: btn.getAttribute("data-rejeitar-evento") })
            .then(function(){ carregarEventos(status); }).catch(function(e){ tratar401(e); });
        });
      });
    }).catch(function(e){ if (!tratar401(e)) alvo.innerHTML = '<div class="msg erro">' + escapeHtml((e && e.error) || "Erro ao carregar.") + '</div>'; });
  }

  function tituloCriterioAdmin(c, regras){
    if (c.tipo === "trilhas_disponiveis") return "Todas as trilhas disponíveis";
    if (c.tipo === "trilha"){
      var t = trilhasParaCriteriosCache.filter(function(tt){ return tt.id === c.trilha_id; })[0];
      return "Trilha: " + (t ? t.titulo : "(removida)");
    }
    if (c.tipo === "atividade") return "Atividades de vídeo (por conclusão)";
    if (c.tipo === "regra"){
      var r = regras.filter(function(rr){ return rr.id === c.regra_id; })[0];
      return r ? r.titulo : "(regra removida)";
    }
    return c.tipo;
  }

        '</div>' +
        '<div class="msg" data-msg-criterio="' + p.id + '"></div>' +
        '<div style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 0 4px;">Faixas (quantos pontos pra cada nível do prêmio)</div>' +
        '<div class="videos-lista">' +
          (faixas.length
            ? faixas.map(function(f){ return '<div class="video-row"><span>' + f.pontos_minimos + ' pts — ' + escapeHtml(f.descricao) + '</span><button type="button" class="btn-danger" data-excluir-faixa="' + f.id + '">Excluir</button></div>'; }).join("")
            : '<div class="vazio">Nenhuma faixa ainda.</div>') +
        '</div>' +
        '<div class="form-row" style="margin-top:8px;">' +
          '<input type="number" class="form-input" placeholder="Pontos mínimos" min="0" data-nova-faixa-pontos="' + p.id + '" style="max-width:160px;">' +
          '<input type="text" class="form-input" placeholder="Descrição (ex: Grátis, 50% de desconto)" data-nova-faixa-descricao="' + p.id + '">' +
          '<button type="button" class="btn" data-add-faixa="' + p.id + '">Adicionar faixa</button>' +
        '</div>' +
        (p.restrito
          ? '<div class="edit-trilha-form" data-elegiveis-form="' + p.id + '" style="display:none;">' +
              '<input type="text" class="form-input busca-input" placeholder="Buscar cliente por nome/CNPJ..." data-elegiveis-busca="' + p.id + '">' +
              '<div data-elegiveis-lista="' + p.id + '" style="max-height:220px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:8px;margin-bottom:8px;"></div>' +
              '<button type="button" class="btn" data-salvar-elegiveis="' + p.id + '">Salvar elegíveis</button>' +
              '<div class="msg" data-msg-elegiveis="' + p.id + '"></div>' +
            '</div>'
          : '') +
        '<div class="msg" data-msg-premio="' + p.id + '"></div>' +
      '</div>';
    }).join("");

    alvo.querySelectorAll("[data-toggle-premio]").forEach(function(btn){
      btn.addEventListener("click", function(){
        apiPost("/api/trilhas-admin", { acao: "editar_premio", id: btn.getAttribute("data-toggle-premio"), ativo: btn.getAttribute("data-ativo") === "true" })
          .then(function(){ carregarGamificacao(); }).catch(function(e){ tratar401(e); });
      });
    });
    alvo.querySelectorAll("[data-editar-premio]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var form = alvo.querySelector('[data-edit-premio-form="' + btn.getAttribute("data-editar-premio") + '"]');
        form.style.display = form.style.display === "none" ? "block" : "none";
      });
    });
    alvo.querySelectorAll("[data-cancelar-premio]").forEach(function(btn){
      btn.addEventListener("click", function(){
        alvo.querySelector('[data-edit-premio-form="' + btn.getAttribute("data-cancelar-premio") + '"]').style.display = "none";
      });
    });
    alvo.querySelectorAll("[data-salvar-premio]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-salvar-premio");
        var titulo = alvo.querySelector('[data-edit-premio-titulo="' + id + '"]').value.trim();
        var msg = alvo.querySelector('[data-msg-edit-premio="' + id + '"]');
        if (!titulo){ msg.className = "msg erro"; msg.textContent = "Preencha o título."; return; }
        var estoqueVal = alvo.querySelector('[data-edit-premio-estoque="' + id + '"]').value;
        apiPost("/api/trilhas-admin", {
          acao: "editar_premio", id: id, titulo: titulo,
          descricao: alvo.querySelector('[data-edit-premio-descricao="' + id + '"]').value.trim(),
          prazoFinal: alvo.querySelector('[data-edit-premio-prazo="' + id + '"]').value || null,
          estoqueTotal: estoqueVal ? parseInt(estoqueVal, 10) : null,
          restrito: alvo.querySelector('[data-edit-premio-restrito="' + id + '"]').checked
        }).then(function(){ carregarGamificacao(); })
          .catch(function(e){ if (!tratar401(e)){ msg.className = "msg erro"; msg.textContent = (e && e.error) || "Erro ao salvar."; } });
      });
    });
    alvo.querySelectorAll("[data-add-faixa]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var premioId = btn.getAttribute("data-add-faixa");
        var pontosEl = alvo.querySelector('[data-nova-faixa-pontos="' + premioId + '"]');
        var descEl = alvo.querySelector('[data-nova-faixa-descricao="' + premioId + '"]');
        var msg = alvo.querySelector('[data-msg-premio="' + premioId + '"]');
        var pontosMinimos = pontosEl.value !== "" ? parseInt(pontosEl.value, 10) : null;
        if (pontosMinimos === null || !descEl.value.trim()){ msg.className = "msg erro"; msg.textContent = "Preencha pontos mínimos e descrição."; return; }
        apiPost("/api/trilhas-admin", { acao: "criar_faixa", premioId: premioId, pontosMinimos: pontosMinimos, descricao: descEl.value.trim() })
          .then(function(){ carregarGamificacao(); })
          .catch(function(e){ if (!tratar401(e)){ msg.className = "msg erro"; msg.textContent = (e && e.error) || "Erro ao adicionar faixa."; } });
      });
    });
    alvo.querySelectorAll("[data-excluir-faixa]").forEach(function(btn){
      btn.addEventListener("click", function(){
        if (!window.confirm("Excluir esta faixa?")) return;
        apiPost("/api/trilhas-admin", { acao: "excluir_faixa", id: btn.getAttribute("data-excluir-faixa") })
          .then(function(){ carregarGamificacao(); }).catch(function(e){ tratar401(e); });
      });
    });

    alvo.querySelectorAll("[data-novo-criterio-tipo]").forEach(function(sel){
      function ajustar(){
        var premioId = sel.getAttribute("data-novo-criterio-tipo");
        var regraSel = alvo.querySelector('[data-novo-criterio-regra="' + premioId + '"]');
        var trilhaSel = alvo.querySelector('[data-novo-criterio-trilha="' + premioId + '"]');
        regraSel.style.display = sel.value === "regra" ? "" : "none";
        trilhaSel.style.display = sel.value === "trilha" ? "" : "none";
      }
      sel.addEventListener("change", ajustar);
      ajustar();
    });
    alvo.querySelectorAll("[data-add-criterio]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var premioId = btn.getAttribute("data-add-criterio");
        var tipo = alvo.querySelector('[data-novo-criterio-tipo="' + premioId + '"]').value;
        var pontosEl = alvo.querySelector('[data-novo-criterio-pontos="' + premioId + '"]');
        var msg = alvo.querySelector('[data-msg-criterio="' + premioId + '"]');
        var pontos = pontosEl.value ? parseInt(pontosEl.value, 10) : null;
        if (!pontos || pontos <= 0){ msg.className = "msg erro"; msg.textContent = "Informe os pontos (maior que zero)."; return; }
        var corpo = { acao: "criar_criterio", premioId: premioId, tipo: tipo, pontos: pontos };
        if (tipo === "regra") corpo.regraId = alvo.querySelector('[data-novo-criterio-regra="' + premioId + '"]').value;
        if (tipo === "trilha") corpo.trilhaId = alvo.querySelector('[data-novo-criterio-trilha="' + premioId + '"]').value;
        if ((tipo === "regra" && !corpo.regraId) || (tipo === "trilha" && !corpo.trilhaId)){
          msg.className = "msg erro"; msg.textContent = "Cadastre uma regra ou trilha antes de usar esse tipo de critério."; return;
        }
        apiPost("/api/trilhas-admin", corpo)
          .then(function(){ carregarGamificacao(); })
          .catch(function(e){ if (!tratar401(e)){ msg.className = "msg erro"; msg.textContent = (e && e.error) || "Erro ao adicionar critério."; } });
      });
    });
    alvo.querySelectorAll("[data-excluir-criterio]").forEach(function(btn){
      btn.addEventListener("click", function(){
        if (!window.confirm("Excluir este critério?")) return;
        apiPost("/api/trilhas-admin", { acao: "excluir_criterio", id: btn.getAttribute("data-excluir-criterio") })
          .then(function(){ carregarGamificacao(); }).catch(function(e){ tratar401(e); });
      });
    });
    alvo.querySelectorAll("[data-editar-criterio]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var form = alvo.querySelector('[data-edit-criterio-form="' + btn.getAttribute("data-editar-criterio") + '"]');
        form.style.display = form.style.display === "none" ? "block" : "none";
      });
    });
    alvo.querySelectorAll("[data-cancelar-criterio]").forEach(function(btn){
      btn.addEventListener("click", function(){
        alvo.querySelector('[data-edit-criterio-form="' + btn.getAttribute("data-cancelar-criterio") + '"]').style.display = "none";
      });
    });
    alvo.querySelectorAll("[data-salvar-criterio]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-salvar-criterio");
        var msg = alvo.querySelector('[data-msg-edit-criterio="' + id + '"]');
        var pontosEl = alvo.querySelector('[data-edit-criterio-pontos="' + id + '"]');
        var pontos = pontosEl.value ? parseInt(pontosEl.value, 10) : null;
        if (!pontos || pontos <= 0){ msg.className = "msg erro"; msg.textContent = "Informe os pontos (maior que zero)."; return; }
        apiPost("/api/trilhas-admin", { acao: "editar_criterio", id: id, pontos: pontos })
          .then(function(){ carregarGamificacao(); })
          .catch(function(e){ if (!tratar401(e)){ msg.className = "msg erro"; msg.textContent = (e && e.error) || "Erro ao salvar."; } });
      });
    });

    alvo.querySelectorAll("[data-gerenciar-elegiveis]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var premioId = btn.getAttribute("data-gerenciar-elegiveis");
        var form = alvo.querySelector('[data-elegiveis-form="' + premioId + '"]');
        var abrir = form.style.display === "none";
        form.style.display = abrir ? "block" : "none";
        if (abrir && !elegiveisSelecionados[premioId]){
          apiGet("/api/trilhas-admin?recurso=premio-elegiveis&premioId=" + encodeURIComponent(premioId)).then(function(j){
            elegiveisSelecionados[premioId] = new Set((j.elegiveis || []).map(function(el){ return el.cliente_id; }));
            renderElegiveisLista(alvo, premioId, "");
          }).catch(function(e){ tratar401(e); });
        } else if (abrir) {
          renderElegiveisLista(alvo, premioId, "");
        }
      });
    });
    alvo.querySelectorAll("[data-elegiveis-busca]").forEach(function(input){
      input.addEventListener("input", function(){
        renderElegiveisLista(alvo, input.getAttribute("data-elegiveis-busca"), input.value);
      });
    });
    alvo.querySelectorAll("[data-salvar-elegiveis]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var premioId = btn.getAttribute("data-salvar-elegiveis");
        var msg = alvo.querySelector('[data-msg-elegiveis="' + premioId + '"]');
        var ids = Array.from(elegiveisSelecionados[premioId] || []);
        apiPost("/api/trilhas-admin", { acao: "definir_elegiveis", premioId: premioId, clienteIds: ids })
          .then(function(){ msg.className = "msg ok"; msg.textContent = ids.length + " cliente(s) elegível(is) salvo(s)."; })
          .catch(function(e){ if (!tratar401(e)){ msg.className = "msg erro"; msg.textContent = (e && e.error) || "Erro ao salvar."; } });
      });
    });
  }

  function renderElegiveisLista(alvo, premioId, query){
    var selecionados = elegiveisSelecionados[premioId] || new Set();
    var termo = (query || "").trim().toLowerCase();
    var candidatos;
    if (termo){
      candidatos = clientesCache.filter(function(c){
        return (c.nome + " " + (c.cnpj || "") + " " + (c.id_nucleo || "")).toLowerCase().indexOf(termo) !== -1;
      }).slice(0, 50);
    } else {
      candidatos = clientesCache.filter(function(c){ return selecionados.has(c.id); });
    }
    var lista = alvo.querySelector('[data-elegiveis-lista="' + premioId + '"]');
    if (!candidatos.length){
      lista.innerHTML = '<div class="vazio">' + (termo ? "Nenhum cliente encontrado." : "Nenhum cliente selecionado ainda — busque acima pra adicionar.") + '</div>';
      return;
    }
    lista.innerHTML = candidatos.map(function(c){
      return '<label style="display:flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 0;">' +
        '<input type="checkbox" class="elegivel-check" value="' + c.id + '"' + (selecionados.has(c.id) ? ' checked' : '') + '> ' +
        escapeHtml(c.nome) + '</label>';
    }).join("");
    lista.querySelectorAll(".elegivel-check").forEach(function(chk){
      chk.addEventListener("change", function(){
        var set = elegiveisSelecionados[premioId] || (elegiveisSelecionados[premioId] = new Set());
        if (chk.checked) set.add(chk.value); else set.delete(chk.value);
      });
    });
  }

  function carregarResgates(status){
    var alvo = document.getElementById("listaResgates");
    if (!alvo) return;
    alvo.innerHTML = '<div class="vazio">Carregando...</div>';
    apiGet("/api/trilhas-admin?recurso=resgates&status=" + encodeURIComponent(status)).then(function(j){
      var resgates = j.resgates || [];
      if (!resgates.length){ alvo.innerHTML = '<div class="vazio">Nenhum resgate ' + STATUS_RESGATE_LABEL[status].toLowerCase() + '.</div>'; return; }
      alvo.innerHTML = '<div style="overflow-x:auto;"><table class="simples"><thead><tr><th>Cliente</th><th>Prêmio</th><th>Faixa</th><th>WhatsApp</th><th>Data</th><th>Status</th></tr></thead><tbody>' +
        resgates.map(function(r){
          var cliente = r.clientes ? r.clientes.nome : "";
          var premio = r.premios ? r.premios.titulo : "";
          var faixa = r.premio_faixas ? r.premio_faixas.descricao : "";
          var data = r.criado_em ? new Date(r.criado_em).toLocaleDateString("pt-BR") : "";
          var opcoes = Object.keys(STATUS_RESGATE_LABEL).map(function(s){
            return '<option value="' + s + '"' + (s === r.status ? ' selected' : '') + '>' + STATUS_RESGATE_LABEL[s] + '</option>';
          }).join("");
          return '<tr>' +
            '<td>' + escapeHtml(cliente) + '</td>' +
            '<td>' + escapeHtml(premio) + '</td>' +
            '<td>' + escapeHtml(faixa) + '</td>' +
            '<td>' + escapeHtml(r.whatsapp || "") + '</td>' +
            '<td>' + data + '</td>' +
            '<td><select class="form-input" data-resgate-status="' + r.id + '" style="min-width:140px;">' + opcoes + '</select></td>' +
          '</tr>';
        }).join("") +
      '</tbody></table></div>';
      alvo.querySelectorAll("[data-resgate-status]").forEach(function(sel){
        sel.addEventListener("change", function(){
          apiPost("/api/trilhas-admin", { acao: "atualizar_resgate", id: sel.getAttribute("data-resgate-status"), status: sel.value })
            .then(function(){ carregarResgates(status); }).catch(function(e){ tratar401(e); });
        });
      });
    }).catch(function(e){ if (!tratar401(e)) alvo.innerHTML = '<div class="msg erro">' + escapeHtml((e && e.error) || "Erro ao carregar.") + '</div>'; });
  }

  // ---------- Início ----------
  apiGet("/api/login").then(function(){ iniciar(); }).catch(function(){ renderLogin(); });
})();
</script>
</body>
</html>
