<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Trilhas de Treinamento</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap');

  :root{
    --azul:#3A86FF; --profundo:#0A41B4;
    --quasebranco:#F0F4FF;
    --bg:#F7F8FC; --surface:#FFFFFF; --surface-2:#EEF2FC;
    --border:#E2E7F5; --border-strong:#C9D3EC;
    --ink:#101033; --ink-2:#3A3F5C; --muted:#5C6180; --muted-2:#8A8FB0;
    --success:#16A34A; --success-bg:#ECFDF5;
    --warning:#B45309; --warning-bg:#FFFBEB;
    --danger:#B91C1C; --danger-bg:#FEF2F2;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1024; --surface:#171933; --surface-2:#1F2242;
      --border:#2B2E56; --border-strong:#3A3D6B;
      --ink:#EDEEFA; --ink-2:#C7C9E8; --muted:#9498C2; --muted-2:#6A6E9C;
      --success:#4ADE80; --success-bg:#0F2A1B;
      --warning:#FBBF24; --warning-bg:#2A2112;
      --danger:#F87171; --danger-bg:#2A1515;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1024; --surface:#171933; --surface-2:#1F2242;
    --border:#2B2E56; --border-strong:#3A3D6B;
    --ink:#EDEEFA; --ink-2:#C7C9E8; --muted:#9498C2; --muted-2:#6A6E9C;
    --success:#4ADE80; --success-bg:#0F2A1B;
    --warning:#FBBF24; --warning-bg:#2A2112;
    --danger:#F87171; --danger-bg:#2A1515;
  }

  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; line-height:1.55;}
  h1,h2,h3{font-family:Poppins,Inter,sans-serif; margin:0; color:var(--ink);}
  .page{max-width:960px; margin:0 auto; padding:28px 20px 90px;}
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:16px; padding-bottom:18px; margin-bottom:22px; border-bottom:1px solid var(--border);}
  .topbar h1{font-size:19px; font-weight:800;}
  .topbar p{margin:2px 0 0; font-size:12.5px; color:var(--muted);}

  .tabs{display:flex; gap:4px; background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:4px; margin-bottom:22px; width:fit-content;}
  .tab-btn{appearance:none; border:none; background:transparent; cursor:pointer; font-family:inherit; font-size:13px; font-weight:600; color:var(--muted); padding:9px 15px; border-radius:9px;}
  .tab-btn.active{background:var(--surface); color:var(--profundo);}
  .panel{display:none;}
  .panel.active{display:block;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px; margin-bottom:16px;}
  .card h2{font-size:15px; font-weight:700; margin-bottom:10px;}
  .form-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
  .form-input, select.form-input, textarea.form-input{padding:9px 11px; border-radius:9px; border:1px solid var(--border-strong); background:var(--surface); color:var(--ink); font-family:inherit; font-size:13px; flex:1; min-width:160px;}
  textarea.form-input{resize:vertical;}
  .btn{background:var(--azul); color:#fff; border:none; font-family:inherit; font-size:13px; font-weight:700; padding:9px 16px; border-radius:9px; cursor:pointer; white-space:nowrap;}
  .btn:hover{background:var(--profundo);}
  .btn:disabled{background:var(--border-strong); color:var(--muted-2); cursor:not-allowed;}
  .btn-danger{background:transparent; color:var(--danger); border:1px solid var(--danger); font-family:inherit; font-size:12px; font-weight:600; padding:5px 10px; border-radius:7px; cursor:pointer;}
  .btn-ghost{background:transparent; color:var(--muted); border:1px solid var(--border-strong); font-family:inherit; font-size:12px; font-weight:600; padding:5px 10px; border-radius:7px; cursor:pointer;}

  .trilha-bloco{border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:10px;}
  .trilha-bloco.arquivada{opacity:.55;}
  .trilha-bloco-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px;}
  .produto-tag{display:inline-block; font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:20px; background:var(--surface-2); color:var(--profundo); margin-bottom:4px;}
  .produto-tag.geral{background:var(--success-bg); color:var(--success);}
  .produtos-checklist{display:flex; flex-wrap:wrap; gap:6px 10px; margin-bottom:8px;}
  .produtos-checklist label{display:flex; align-items:center; gap:5px; font-size:12.5px; color:var(--ink-2);}
  .produtos-checklist.disabled{opacity:.45; pointer-events:none;}
  .geral-toggle{display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; margin-bottom:10px;}
  .video-row{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:7px 0; border-top:1px solid var(--border); font-size:13px;}
  .video-row:first-child{border-top:none;}
  .video-row-info{display:flex; align-items:center; gap:8px; min-width:0;}
  .video-row-titulo{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .video-row-acoes{display:flex; gap:4px; flex-shrink:0;}
  .btn-ordem{background:transparent; border:1px solid var(--border-strong); color:var(--muted); font-size:11px; line-height:1; padding:4px 7px; border-radius:6px; cursor:pointer;}
  .btn-ordem:hover{color:var(--ink); border-color:var(--ink-2);}
  .btn-ordem:disabled{opacity:.3; cursor:not-allowed;}
  .edit-video-form{border-top:1px solid var(--border); padding-top:8px; margin-top:6px;}
  .busca-input{margin-bottom:14px;}
  .msg{font-size:12.5px; margin-top:8px; min-height:16px;}
  .msg.erro{color:var(--danger);}
  .msg.ok{color:var(--success);}
  table.simples{width:100%; font-size:13px; border-collapse:collapse;}
  table.simples th, table.simples td{text-align:left; padding:8px 6px; border-bottom:1px solid var(--border);}
  table.simples th{font-size:11px; text-transform:uppercase; color:var(--muted); letter-spacing:.04em;}
  .vazio{font-size:13px; color:var(--muted); padding:6px 0;}
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <div>
      <h1>Admin — Trilhas de Treinamento</h1>
      <p>Uso interno · gestão/CSM/ISM</p>
    </div>
  </header>
  <div id="raiz"></div>
</div>

<script>
(function(){
  "use strict";
  var raiz = document.getElementById("raiz");

  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;", "'":"&#39;" }[c];
    });
  }
  function tratarResposta(r){
    return r.json().then(function(j){ if (!r.ok) throw j; return j; });
  }
  function apiGet(path){ return fetch(path, { credentials: "same-origin" }).then(tratarResposta); }
  function apiPost(path, body){
    return fetch(path, {
      method: "POST", credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {})
    }).then(tratarResposta);
  }

  // ---------- Login (mesma sessão interna de implantacao-waipe.html / dashboard_carteiras.html) ----------
  function renderLogin(){
    raiz.innerHTML =
      '<div class="card" style="max-width:380px;margin:60px auto;">' +
        '<h2 style="margin-bottom:6px;">Entrar</h2>' +
        '<p style="font-size:12.5px;color:var(--muted);margin:0 0 14px;">Sessão interna — mesma senha do painel de implantação.</p>' +
        '<input type="password" id="loginSenha" class="form-input" style="width:100%;margin-bottom:10px;" placeholder="Senha de acesso">' +
        '<button type="button" class="btn" style="width:100%;" id="btnEntrar">Entrar</button>' +
        '<div class="msg erro" id="loginErro"></div>' +
      '</div>';
    var senha = document.getElementById("loginSenha");
    var btn = document.getElementById("btnEntrar");
    var erroEl = document.getElementById("loginErro");
    function tentar(){
      if (!senha.value){ erroEl.textContent = "Digite a senha."; return; }
      btn.disabled = true; btn.textContent = "Entrando...";
      apiPost("/api/login", { senha: senha.value })
        .then(function(){ iniciar(); })
        .catch(function(e){
          erroEl.textContent = (e && e.error) || "Senha incorreta.";
          btn.disabled = false; btn.textContent = "Entrar";
        });
    }
    btn.addEventListener("click", tentar);
    senha.addEventListener("keydown", function(e){ if (e.key === "Enter") tentar(); });
    senha.focus();
  }

  function tratar401(e){
    if (e && e.code === "sessao_invalida"){ renderLogin(); return true; }
    return false;
  }

  // ---------- Layout principal ----------
  // Lista de produtos sugerida nos checkboxes de trilha. Começa com um
  // fallback pequeno (produtos que não vêm de um plano com "camadas", tipo
  // Waipe) e, assim que os clientes forem carregados, passa a refletir os
  // valores REAIS vindos do ClickUp — Unique e Gestor não existem como valor
  // isolado lá, o que existe é "Unique Light/Plus/Premium" etc. Usar uma lista
  // fixa e chutada foi o que causou trilha marcada "Unique" não aparecer pra
  // quem tinha "Unique Light".
  var produtosConhecidos = ["Waipe", "Analytics Pro", "IA Bime", "Datalab"];
  function atualizarProdutosConhecidos(clientes){
    var vistos = {};
    clientes.forEach(function(c){ (c.produtos_ativos || []).forEach(function(p){ vistos[p] = true; }); });
    var lista = Object.keys(vistos);
    if (lista.length) produtosConhecidos = lista.sort(function(a, b){ return a.localeCompare(b, "pt-BR"); });
  }

  function iniciar(){
    raiz.innerHTML =
      '<div class="tabs">' +
        '<button class="tab-btn active" data-tab="trilhas">Trilhas</button>' +
        '<button class="tab-btn" data-tab="clientes">Clientes &amp; E-mails</button>' +
        '<button class="tab-btn" data-tab="indicadores">Indicadores</button>' +
      '</div>' +
      '<section class="panel active" id="panel-trilhas"></section>' +
      '<section class="panel" id="panel-clientes"></section>' +
      '<section class="panel" id="panel-indicadores"></section>';

    var panels = {
      trilhas: document.getElementById("panel-trilhas"),
      clientes: document.getElementById("panel-clientes"),
      indicadores: document.getElementById("panel-indicadores")
    };
    var indicadoresCarregados = false;
    raiz.querySelectorAll(".tab-btn").forEach(function(btn){
      btn.addEventListener("click", function(){
        raiz.querySelectorAll(".tab-btn").forEach(function(b){ b.classList.remove("active"); });
        btn.classList.add("active");
        Object.keys(panels).forEach(function(k){ panels[k].classList.remove("active"); });
        var tab = btn.getAttribute("data-tab");
        panels[tab].classList.add("active");
        if (tab === "indicadores" && !indicadoresCarregados){ indicadoresCarregados = true; carregarIndicadoresAdmin(); }
      });
    });

    // Clientes primeiro: além de preencher a própria aba, alimenta
    // produtosConhecidos, usado pelos checkboxes de produto da aba Trilhas.
    carregarClientes().then(function(){ carregarTrilhas(); });
  }

  // ---------- Aba Trilhas ----------
  function carregarTrilhas(){
    var root = document.getElementById("panel-trilhas");
    root.innerHTML = '<div class="vazio">Carregando...</div>';
    apiGet("/api/trilhas-admin").then(function(j){ renderTrilhas(root, j.trilhas || []); })
      .catch(function(e){ if (!tratar401(e)) root.innerHTML = '<div class="msg erro">' + escapeHtml((e && e.error) || "Erro ao carregar.") + '</div>'; });
  }

  /** Checkboxes de produto — reaproveitado no form de criar e no de editar.
   * `checados` inclui qualquer produto customizado que a trilha já tenha (não
   * só os sugeridos), pra editar não "esquecer" um produto avulso cadastrado antes. */
  function produtosChecklistHtml(classe, checados){
    var opcoes = produtosConhecidos.slice();
    (checados || []).forEach(function(p){ if (opcoes.indexOf(p) === -1) opcoes.push(p); });
    return opcoes.map(function(p){
      var marcado = checados && checados.indexOf(p) !== -1;
      return '<label><input type="checkbox" class="' + classe + '" value="' + escapeHtml(p) + '"' + (marcado ? ' checked' : '') + '> ' + escapeHtml(p) + '</label>';
    }).join("");
  }

  /** Uma linha de vídeo + o form de edição escondido embaixo dela. */
  function videoRowHtml(t, v, i, total){
    return (
      '<div class="video-row' + (v.ativo === false ? ' arquivada' : '') + '" data-video-row="' + v.id + '">' +
        '<div class="video-row-info">' +
          '<div class="video-row-acoes">' +
            '<button type="button" class="btn-ordem" data-mover-video="' + v.id + '" data-trilha="' + t.id + '" data-direcao="up"' + (i === 0 ? ' disabled' : '') + '>▲</button>' +
            '<button type="button" class="btn-ordem" data-mover-video="' + v.id + '" data-trilha="' + t.id + '" data-direcao="down"' + (i === total - 1 ? ' disabled' : '') + '>▼</button>' +
          '</div>' +
          '<span class="video-row-titulo">' + escapeHtml(v.titulo) + ' <span style="color:var(--muted-2);">(' + escapeHtml(v.youtube_id) + ')</span></span>' +
        '</div>' +
        '<div style="display:flex;gap:4px;flex-shrink:0;">' +
          '<button type="button" class="btn-ghost" data-editar-video="' + v.id + '">Editar</button>' +
          '<button type="button" class="btn-ghost" data-arquivar-video="' + v.id + '" data-ativo="' + (v.ativo === false) + '">' + (v.ativo === false ? 'Reativar' : 'Arquivar') + '</button>' +
          '<button type="button" class="btn-danger" data-excluir-video="' + v.id + '">Excluir</button>' +
        '</div>' +
      '</div>' +
      '<div class="edit-video-form" data-edit-video-form="' + v.id + '" style="display:none;">' +
        '<div class="form-row">' +
          '<input type="text" class="form-input" data-edit-video-titulo="' + v.id + '" value="' + escapeHtml(v.titulo) + '" placeholder="Título">' +
          '<input type="text" class="form-input" data-edit-video-youtube="' + v.id + '" value="' + escapeHtml(v.youtube_id) + '" placeholder="Link ou ID do YouTube">' +
        '</div>' +
        '<div class="form-row">' +
          '<textarea class="form-input" data-edit-video-nota="' + v.id + '" placeholder="Nota (opcional) — ex: link pra base de conhecimento" rows="2">' + escapeHtml(v.nota || "") + '</textarea>' +
        '</div>' +
        '<div class="form-row">' +
          '<button type="button" class="btn" data-salvar-video="' + v.id + '">Salvar</button>' +
          '<button type="button" class="btn-ghost" data-cancelar-video="' + v.id + '">Cancelar</button>' +
        '</div>' +
        '<div class="msg" data-msg-edit-video="' + v.id + '"></div>' +
      '</div>'
    );
  }

  function renderTrilhas(root, trilhas){
    var lista = trilhas.slice().sort(function(a, b){ return a.titulo.localeCompare(b.titulo, "pt-BR"); });

    var html =
      '<div class="card">' +
        '<h2>Nova trilha</h2>' +
        '<div class="form-row">' +
          '<input type="text" id="novaTitulo" class="form-input" placeholder="Título da trilha">' +
        '</div>' +
        '<label class="geral-toggle"><input type="checkbox" id="novoGeral"> Trilha geral — aparece pra todo cliente, de qualquer produto</label>' +
        '<div class="produtos-checklist" id="novoProdutosBox">' +
          produtosChecklistHtml("novo-produto-check", []) +
        '</div>' +
        '<div class="form-row">' +
          '<input type="text" id="novoProdutoExtra" class="form-input" placeholder="Outro produto (opcional, separado por vírgula)">' +
          '<button type="button" class="btn" id="btnCriarTrilha">Criar</button>' +
        '</div>' +
        '<div class="msg" id="msgNovaTrilha"></div>' +
      '</div>' +
      '<input type="text" id="buscaTrilhas" class="form-input busca-input" placeholder="Buscar trilha ou vídeo pelo título...">';

    lista.forEach(function(t){
        var videos = (t.trilha_videos || []).slice().sort(function(a,b){ return a.ordem - b.ordem; });
        var produtosAtuais = t.produtos || [];
        var chips = produtosAtuais.length
          ? produtosAtuais.map(function(p){ return '<span class="produto-tag">' + escapeHtml(p) + '</span>'; }).join(" ")
          : '<span class="produto-tag geral">Geral</span>';
        var textoBusca = (t.titulo + " " + videos.map(function(v){ return v.titulo; }).join(" ")).toLowerCase();
        html +=
          '<div class="trilha-bloco' + (t.ativa ? '' : ' arquivada') + '" data-trilha-id="' + t.id + '" data-busca="' + escapeHtml(textoBusca) + '">' +
            '<div class="trilha-bloco-head">' +
              '<div class="trilha-visao" data-trilha-visao="' + t.id + '">' +
                '<b>' + escapeHtml(t.titulo) + '</b>' + (t.ativa ? '' : ' <span class="produto-tag">arquivada</span>') +
                '<div style="margin-top:5px;">' + chips + '</div>' +
              '</div>' +
              '<div style="display:flex;gap:6px;flex-shrink:0;">' +
                '<button type="button" class="btn-ghost" data-editar-trilha="' + t.id + '">Editar</button>' +
                '<button type="button" class="btn-ghost" data-arquivar-trilha="' + t.id + '" data-ativa="' + (!t.ativa) + '">' + (t.ativa ? 'Arquivar' : 'Reativar') + '</button>' +
              '</div>' +
            '</div>' +
            '<div class="edit-trilha-form" data-edit-form="' + t.id + '" style="display:none;margin-bottom:10px;">' +
              '<div class="form-row">' +
                '<input type="text" class="form-input" data-edit-titulo="' + t.id + '" value="' + escapeHtml(t.titulo) + '">' +
              '</div>' +
              '<label class="geral-toggle"><input type="checkbox" data-edit-geral="' + t.id + '"' + (produtosAtuais.length ? '' : ' checked') + '> Trilha geral — aparece pra todo cliente, de qualquer produto</label>' +
              '<div class="produtos-checklist' + (produtosAtuais.length ? '' : ' disabled') + '" data-edit-produtos-box="' + t.id + '">' +
                produtosChecklistHtml("edit-produto-check-" + t.id, produtosAtuais) +
              '</div>' +
              '<div class="form-row">' +
                '<input type="text" class="form-input" placeholder="Outro produto (opcional, separado por vírgula)" data-edit-produto-extra="' + t.id + '"' + (produtosAtuais.length ? '' : ' disabled') + '>' +
                '<button type="button" class="btn" data-salvar-trilha="' + t.id + '">Salvar</button>' +
                '<button type="button" class="btn-ghost" data-cancelar-edicao="' + t.id + '">Cancelar</button>' +
              '</div>' +
              '<div class="msg" data-msg-edit="' + t.id + '"></div>' +
            '</div>' +
            '<div class="videos-lista">' +
              (videos.length
                ? videos.map(function(v, i){ return videoRowHtml(t, v, i, videos.length); }).join("")
                : '<div class="vazio">Nenhum vídeo ainda.</div>') +
            '</div>' +
            '<div class="form-row" style="margin-top:10px;">' +
              '<input type="text" class="form-input" placeholder="Título do vídeo" data-novo-video-titulo="' + t.id + '">' +
              '<input type="text" class="form-input" placeholder="Link ou ID do YouTube" data-novo-video-url="' + t.id + '">' +
            '</div>' +
            '<div class="form-row">' +
              '<textarea class="form-input" placeholder="Nota (opcional)" rows="1" data-novo-video-nota="' + t.id + '"></textarea>' +
              '<button type="button" class="btn" data-add-video="' + t.id + '">Adicionar vídeo</button>' +
            '</div>' +
            '<div class="msg" data-msg-trilha="' + t.id + '"></div>' +
          '</div>';
    });

    root.innerHTML = html;

    document.getElementById("buscaTrilhas").addEventListener("input", function(e){
      var q = e.target.value.trim().toLowerCase();
      root.querySelectorAll(".trilha-bloco").forEach(function(bloco){
        bloco.style.display = (!q || bloco.getAttribute("data-busca").indexOf(q) !== -1) ? "" : "none";
      });
    });

    var novoGeral = document.getElementById("novoGeral");
    var novoProdutosBox = document.getElementById("novoProdutosBox");
    novoGeral.addEventListener("change", function(){
      novoProdutosBox.classList.toggle("disabled", novoGeral.checked);
      document.getElementById("novoProdutoExtra").disabled = novoGeral.checked;
    });

    root.querySelectorAll("[data-editar-trilha]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-editar-trilha");
        var form = root.querySelector('[data-edit-form="' + id + '"]');
        form.style.display = form.style.display === "none" ? "block" : "none";
      });
    });
    root.querySelectorAll("[data-cancelar-edicao]").forEach(function(btn){
      btn.addEventListener("click", function(){
        root.querySelector('[data-edit-form="' + btn.getAttribute("data-cancelar-edicao") + '"]').style.display = "none";
      });
    });
    root.querySelectorAll("[data-edit-geral]").forEach(function(chk){
      chk.addEventListener("change", function(){
        var id = chk.getAttribute("data-edit-geral");
        root.querySelector('[data-edit-produtos-box="' + id + '"]').classList.toggle("disabled", chk.checked);
        root.querySelector('[data-edit-produto-extra="' + id + '"]').disabled = chk.checked;
      });
    });
    root.querySelectorAll("[data-salvar-trilha]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-salvar-trilha");
        var titulo = root.querySelector('[data-edit-titulo="' + id + '"]').value.trim();
        var geral = root.querySelector('[data-edit-geral="' + id + '"]').checked;
        var msg = root.querySelector('[data-msg-edit="' + id + '"]');
        if (!titulo){ msg.className = "msg erro"; msg.textContent = "Preencha o título."; return; }

        var produtos = [];
        if (!geral){
          root.querySelectorAll('[data-edit-produtos-box="' + id + '"] input:checked').forEach(function(el){ produtos.push(el.value); });
          var extra = root.querySelector('[data-edit-produto-extra="' + id + '"]').value.trim();
          if (extra) extra.split(",").forEach(function(p){ p = p.trim(); if (p) produtos.push(p); });
          if (!produtos.length){ msg.className = "msg erro"; msg.textContent = "Selecione ao menos um produto ou marque \"Trilha geral\"."; return; }
        }

        apiPost("/api/trilhas-admin", { acao: "editar_trilha", id: id, titulo: titulo, produtos: produtos })
          .then(function(){ carregarTrilhas(); })
          .catch(function(e){ if (!tratar401(e)){ msg.className = "msg erro"; msg.textContent = (e && e.error) || "Erro ao salvar."; } });
      });
    });

    document.getElementById("btnCriarTrilha").addEventListener("click", function(){
      var titulo = document.getElementById("novaTitulo").value.trim();
      var msg = document.getElementById("msgNovaTrilha");
      if (!titulo){ msg.className = "msg erro"; msg.textContent = "Preencha o título."; return; }

      var produtos = [];
      if (!novoGeral.checked){
        root.querySelectorAll(".novo-produto-check:checked").forEach(function(el){ produtos.push(el.value); });
        var extra = document.getElementById("novoProdutoExtra").value.trim();
        if (extra) extra.split(",").forEach(function(p){ p = p.trim(); if (p) produtos.push(p); });
        if (!produtos.length){ msg.className = "msg erro"; msg.textContent = "Selecione ao menos um produto ou marque \"Trilha geral\"."; return; }
      }

      apiPost("/api/trilhas-admin", { acao: "criar_trilha", titulo: titulo, produtos: produtos })
        .then(function(){ carregarTrilhas(); })
        .catch(function(e){ if (!tratar401(e)){ msg.className = "msg erro"; msg.textContent = (e && e.error) || "Erro ao criar trilha."; } });
    });

    root.querySelectorAll("[data-arquivar-trilha]").forEach(function(btn){
      btn.addEventListener("click", function(){
        apiPost("/api/trilhas-admin", { acao: "arquivar_trilha", id: btn.getAttribute("data-arquivar-trilha"), ativa: btn.getAttribute("data-ativa") === "true" })
          .then(function(){ carregarTrilhas(); })
          .catch(function(e){ tratar401(e); });
      });
    });
    root.querySelectorAll("[data-arquivar-video]").forEach(function(btn){
      btn.addEventListener("click", function(){
        apiPost("/api/trilhas-admin", { acao: "arquivar_video", id: btn.getAttribute("data-arquivar-video"), ativo: btn.getAttribute("data-ativo") === "true" })
          .then(function(){ carregarTrilhas(); })
          .catch(function(e){ tratar401(e); });
      });
    });
    root.querySelectorAll("[data-add-video]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var trilhaId = btn.getAttribute("data-add-video");
        var tituloEl = root.querySelector('[data-novo-video-titulo="' + trilhaId + '"]');
        var urlEl = root.querySelector('[data-novo-video-url="' + trilhaId + '"]');
        var notaEl = root.querySelector('[data-novo-video-nota="' + trilhaId + '"]');
        var msg = root.querySelector('[data-msg-trilha="' + trilhaId + '"]');
        if (!tituloEl.value.trim() || !urlEl.value.trim()){ msg.className = "msg erro"; msg.textContent = "Preencha título e link/ID."; return; }
        apiPost("/api/trilhas-admin", { acao: "criar_video", trilhaId: trilhaId, titulo: tituloEl.value.trim(), youtube: urlEl.value.trim(), nota: notaEl.value.trim() })
          .then(function(){ carregarTrilhas(); })
          .catch(function(e){ if (!tratar401(e)){ msg.className = "msg erro"; msg.textContent = (e && e.error) || "Erro ao adicionar vídeo."; } });
      });
    });

    root.querySelectorAll("[data-editar-video]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var form = root.querySelector('[data-edit-video-form="' + btn.getAttribute("data-editar-video") + '"]');
        form.style.display = form.style.display === "none" ? "block" : "none";
      });
    });
    root.querySelectorAll("[data-cancelar-video]").forEach(function(btn){
      btn.addEventListener("click", function(){
        root.querySelector('[data-edit-video-form="' + btn.getAttribute("data-cancelar-video") + '"]').style.display = "none";
      });
    });
    root.querySelectorAll("[data-salvar-video]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-salvar-video");
        var titulo = root.querySelector('[data-edit-video-titulo="' + id + '"]').value.trim();
        var youtube = root.querySelector('[data-edit-video-youtube="' + id + '"]').value.trim();
        var nota = root.querySelector('[data-edit-video-nota="' + id + '"]').value.trim();
        var msg = root.querySelector('[data-msg-edit-video="' + id + '"]');
        if (!titulo || !youtube){ msg.className = "msg erro"; msg.textContent = "Preencha título e link/ID."; return; }
        apiPost("/api/trilhas-admin", { acao: "editar_video", id: id, titulo: titulo, youtube: youtube, nota: nota })
          .then(function(){ carregarTrilhas(); })
          .catch(function(e){ if (!tratar401(e)){ msg.className = "msg erro"; msg.textContent = (e && e.error) || "Erro ao salvar."; } });
      });
    });
    root.querySelectorAll("[data-excluir-video]").forEach(function(btn){
      btn.addEventListener("click", function(){
        if (!window.confirm("Excluir este vídeo? Isso também apaga o histórico de quem já assistiu — não dá pra desfazer. Se é só pra deixar de aparecer pro cliente, prefira \"Arquivar\".")) return;
        apiPost("/api/trilhas-admin", { acao: "excluir_video", id: btn.getAttribute("data-excluir-video") })
          .then(function(){ carregarTrilhas(); })
          .catch(function(e){ tratar401(e); });
      });
    });
    root.querySelectorAll("[data-mover-video]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var trilhaId = btn.getAttribute("data-trilha");
        var videoId = btn.getAttribute("data-mover-video");
        var direcao = btn.getAttribute("data-direcao");
        var linhas = Array.prototype.slice.call(root.querySelectorAll('.trilha-bloco[data-trilha-id="' + trilhaId + '"] [data-video-row]'));
        var ids = linhas.map(function(l){ return l.getAttribute("data-video-row"); });
        var i = ids.indexOf(videoId);
        var j = direcao === "up" ? i - 1 : i + 1;
        if (i < 0 || j < 0 || j >= ids.length) return;
        var tmp = ids[i]; ids[i] = ids[j]; ids[j] = tmp;
        apiPost("/api/trilhas-admin", { acao: "reordenar_videos", ids: ids })
          .then(function(){ carregarTrilhas(); })
          .catch(function(e){ tratar401(e); });
      });
    });
  }

  // ---------- Aba Clientes & E-mails ----------
  function carregarClientes(){
    var root = document.getElementById("panel-clientes");
    root.innerHTML = '<div class="vazio">Carregando...</div>';
    return apiGet("/api/trilhas-admin?recurso=clientes").then(function(j){
      atualizarProdutosConhecidos(j.clientes || []);
      renderClientes(root, j.clientes || [], j.emails || []);
    }).catch(function(e){ if (!tratar401(e)) root.innerHTML = '<div class="msg erro">' + escapeHtml((e && e.error) || "Erro ao carregar.") + '</div>'; });
  }

  function renderClientes(root, clientes, emails){
    var emailsPorCliente = {};
    emails.forEach(function(e){ (emailsPorCliente[e.cliente_id] = emailsPorCliente[e.cliente_id] || []).push(e); });

    var html =
      '<div class="card">' +
        '<h2>Sincronizar com o ClickUp (Carteira)</h2>' +
        '<p style="font-size:12.5px;color:var(--muted);margin:0 0 10px;">Atualiza nome, CNPJ e produtos ativados de todos os clientes. Não roda sozinho — produto recém-ativado só libera a trilha depois de sincronizar de novo.</p>' +
        '<button type="button" class="btn" id="btnSincronizar">Sincronizar agora</button>' +
        '<div class="msg" id="msgSync"></div>' +
      '</div>' +
      '<div class="card">' +
        '<h2>Clientes (' + clientes.length + ')</h2>' +
        (clientes.length ? '<input type="text" id="buscaClientes" class="form-input busca-input" placeholder="Buscar por nome, CNPJ ou e-mail...">' : '') +
        (clientes.length
          ? '<div style="overflow-x:auto;"><table class="simples"><thead><tr><th>Cliente</th><th>Produtos</th><th>E-mails autorizados</th></tr></thead><tbody>' +
              clientes.map(function(c){
                var els = emailsPorCliente[c.id] || [];
                var textoBusca = [c.nome, c.cnpj, c.id_nucleo].concat(els.map(function(e){ return e.email; })).join(" ").toLowerCase();
                return '<tr data-busca="' + escapeHtml(textoBusca) + '">' +
                  '<td><b>' + escapeHtml(c.nome) + '</b><br><span style="color:var(--muted-2);font-size:11px;">' + escapeHtml(c.id_nucleo) + (c.cnpj ? " · " + escapeHtml(c.cnpj) : "") + '</span></td>' +
                  '<td>' + (c.produtos_ativos || []).map(function(p){ return '<span class="produto-tag">' + escapeHtml(p) + '</span>'; }).join(" ") + '</td>' +
                  '<td>' +
                    els.map(function(e){
                      return '<div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;">' + escapeHtml(e.email) +
                        ' <button type="button" class="btn-danger" data-remover-email="' + e.id + '">remover</button></div>';
                    }).join("") +
                    '<div class="form-row" style="margin-top:6px;">' +
                      '<input type="email" class="form-input" placeholder="novo e-mail" data-novo-email="' + c.id + '" style="min-width:140px;">' +
                      '<button type="button" class="btn-ghost" data-add-email="' + c.id + '">Adicionar</button>' +
                    '</div>' +
                    '<div class="msg" data-msg-cliente="' + c.id + '"></div>' +
                  '</td>' +
                '</tr>';
              }).join("") +
            '</tbody></table></div>'
          : '<div class="vazio">Nenhum cliente sincronizado ainda. Clique em "Sincronizar agora".</div>') +
      '</div>';

    root.innerHTML = html;

    var buscaClientes = document.getElementById("buscaClientes");
    if (buscaClientes){
      buscaClientes.addEventListener("input", function(e){
        var q = e.target.value.trim().toLowerCase();
        root.querySelectorAll("tr[data-busca]").forEach(function(tr){
          tr.style.display = (!q || tr.getAttribute("data-busca").indexOf(q) !== -1) ? "" : "none";
        });
      });
    }

    document.getElementById("btnSincronizar").addEventListener("click", function(){
      var msg = document.getElementById("msgSync");
      var btn = document.getElementById("btnSincronizar");
      btn.disabled = true; btn.textContent = "Sincronizando...";
      apiPost("/api/trilhas-admin", { acao: "sincronizar" })
        .then(function(j){
          msg.className = "msg ok";
          msg.textContent = "OK — " + j.processados + " processados, " + (j.desativados || 0) + " desativados.";
          carregarClientes();
        })
        .catch(function(e){
          if (!tratar401(e)){ msg.className = "msg erro"; msg.textContent = (e && e.error) || "Erro ao sincronizar."; }
        })
        .then(function(){ btn.disabled = false; btn.textContent = "Sincronizar agora"; });
    });

    root.querySelectorAll("[data-remover-email]").forEach(function(btn){
      btn.addEventListener("click", function(){
        apiPost("/api/trilhas-admin", { acao: "remover_email", emailId: btn.getAttribute("data-remover-email") })
          .then(function(){ carregarClientes(); })
          .catch(function(e){ tratar401(e); });
      });
    });
    root.querySelectorAll("[data-add-email]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var clienteId = btn.getAttribute("data-add-email");
        var input = root.querySelector('[data-novo-email="' + clienteId + '"]');
        var msg = root.querySelector('[data-msg-cliente="' + clienteId + '"]');
        if (!input.value.trim()){ msg.className = "msg erro"; msg.textContent = "Informe um e-mail."; return; }
        apiPost("/api/trilhas-admin", { acao: "adicionar_email", clienteId: clienteId, email: input.value.trim() })
          .then(function(){ carregarClientes(); })
          .catch(function(e){ if (!tratar401(e)){ msg.className = "msg erro"; msg.textContent = (e && e.error) || "Erro ao adicionar e-mail."; } });
      });
    });
  }

  // ---------- Aba Indicadores ----------
  // Lista completa por cliente — a aba Indicadores de implantacao-waipe.html
  // mostra só um resumo agora; o detalhe por cliente vive aqui, que é a
  // ferramenta de treinamento propriamente dita.
  function carregarIndicadoresAdmin(){
    var root = document.getElementById("panel-indicadores");
    root.innerHTML = '<div class="vazio">Carregando...</div>';
    apiGet("/api/trilhas-admin?recurso=indicadores").then(function(j){ renderIndicadoresAdmin(root, j.indicadores || []); })
      .catch(function(e){ if (!tratar401(e)) root.innerHTML = '<div class="msg erro">' + escapeHtml((e && e.error) || "Erro ao carregar.") + '</div>'; });
  }

  function renderIndicadoresAdmin(root, linhas){
    var comTrilha = linhas.filter(function(l){ return l.videosDisponiveis > 0; })
      .sort(function(a, b){ return (b.percentual || 0) - (a.percentual || 0); });

    var html =
      '<div class="card">' +
        '<h2>Engajamento por cliente (' + comTrilha.length + ')</h2>' +
        (comTrilha.length ? '<input type="text" id="buscaIndicadores" class="form-input busca-input" placeholder="Buscar por cliente...">' : '') +
        (comTrilha.length
          ? '<div style="overflow-x:auto;"><table class="simples"><thead><tr><th>Cliente</th><th>Vídeos assistidos</th><th>Última atividade</th></tr></thead><tbody>' +
              comTrilha.map(function(l){
                var ultima = l.ultimaAtividade ? new Date(l.ultimaAtividade).toLocaleDateString("pt-BR") : "—";
                var textoBusca = [l.nome, l.cnpj, l.idNucleo].join(" ").toLowerCase();
                return '<tr data-busca="' + escapeHtml(textoBusca) + '">' +
                  '<td><b>' + escapeHtml(l.nome || l.idNucleo || "") + '</b></td>' +
                  '<td>' + l.videosAssistidos + '/' + l.videosDisponiveis + ' (' + (l.percentual == null ? "—" : l.percentual + '%') + ')</td>' +
                  '<td>' + ultima + '</td>' +
                '</tr>';
              }).join("") +
            '</tbody></table></div>'
          : '<div class="vazio">Nenhum cliente com trilha disponível ainda.</div>') +
      '</div>';

    root.innerHTML = html;

    var busca = document.getElementById("buscaIndicadores");
    if (busca){
      busca.addEventListener("input", function(e){
        var q = e.target.value.trim().toLowerCase();
        root.querySelectorAll("tr[data-busca]").forEach(function(tr){
          tr.style.display = (!q || tr.getAttribute("data-busca").indexOf(q) !== -1) ? "" : "none";
        });
      });
    }
  }

  // ---------- Início ----------
  apiGet("/api/login").then(function(){ iniciar(); }).catch(function(){ renderLogin(); });
})();
</script>
</body>
</html>
